[project]
name = "earhart-search"
version = "0.1.0"
description = "Reproducible probabilistic reconstruction of the final flight of Earhart and Noonan (2 July 1937)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "pyproj>=3.6",
    "shapely>=2.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
gis = ["geopandas>=0.14", "rasterio>=1.3", "xarray>=2024.1", "simplekml>=1.3"]
viz = ["matplotlib>=3.8", "plotly>=5.18", "folium>=0.16"]

[dependency-groups]
dev = ["pytest>=8.0", "jupyter>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/earhart"]

[tool.pytest.ini_options]
testpaths = ["tests"]
